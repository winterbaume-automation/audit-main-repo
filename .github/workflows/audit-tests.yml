name: Audit Script Tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/config/**"
      - ".github/workflows/audit-tests.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/config/**"
      - ".github/workflows/audit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      - name: Syntax check
        run: |
          python -m py_compile .github/scripts/audit_commit.py
          python -m py_compile .github/scripts/reconcile_main.py

      - name: Run pytest
        run: python -m pytest .github/scripts/tests/ -v
