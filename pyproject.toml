[project]
name = "winterbaume-audit-main-repo"
version = "0.0.0"
description = "Automated integrity audit of commits pushed to moriyoshi/winterbaume."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [".github/scripts/tests"]
pythonpath = [".github/scripts"]
